<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a review desk. The cut on the left at phone size, the notes rail on the right; stacked on phones. */
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --sunk: #EFEBE3; --fg: #1C1C1F; --muted: #6B675F;
  --line: #E2DDD3; --accent: #9A6F12; --accent-ink: #FFFFFF; --done: #3F7D55; --open: #B4442F;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B0B0D; --surface: #17171B; --sunk: #111114; --fg: #F4EFE6; --muted: #9A958C; --line: #2A2A30; --accent: #E8B44A; --accent-ink: #17140C; --done: #6FBF8E; --open: #F0806B; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0B0B0D; --surface: #17171B; --sunk: #111114; --fg: #F4EFE6; --muted: #9A958C; --line: #2A2A30; --accent: #E8B44A; --accent-ink: #17140C; --done: #6FBF8E; --open: #F0806B; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 650; font-size: clamp(26px, 4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.versions button { font: 600 13px var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.versions button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.versions button:focus-visible, button:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.changes { color: var(--muted); max-width: 70ch; margin: 2px 0 0; }
.desk { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.player { background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.player video { display: block; width: 100%; max-height: 78vh; aspect-ratio: var(--aspect, 9 / 16); object-fit: contain; background: #000; max-width: 100%; }
.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; padding: 8px 2px 0; font-variant-numeric: tabular-nums; }
.rail { display: grid; gap: 14px; min-width: 0; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.composer label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.stamp { font: 700 13px var(--body); font-variant-numeric: tabular-nums; background: var(--sunk); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
textarea { font: 15px/1.45 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 76px; resize: vertical; width: 100%; box-sizing: border-box; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.hint { color: var(--muted); font-size: 13px; }
.primary { font: 600 14px var(--body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
.primary:disabled { opacity: .5; cursor: default; }
.listhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.listhead h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; }
.filter { display: flex; gap: 6px; }
.filter button { font: 600 12px var(--body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.filter button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
ol.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--open); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.note.done { border-left-color: var(--done); }
.note.done .text { color: var(--muted); }
.note .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { font: 700 13px var(--body); font-variant-numeric: tabular-nums; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.who { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.who img { width: 20px; height: 20px; border-radius: 50%; }
.status { margin-left: auto; font: 600 12px var(--body); border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); background: transparent; color: var(--open); cursor: pointer; }
.note.done .status { color: var(--done); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; white-space: pre-wrap; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
.notice { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Review</div>
    <h1 id="title">Review</h1>
    <div class="versions" id="versions" role="group" aria-label="Versions"></div>
    <p class="changes" id="changes"></p>
  </header>

  <section class="desk">
    <div>
      <div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
      <div class="meta"><span id="vmeta"></span><span id="clock">0:00.0</span></div>
    </div>

    <div class="rail">
      <form class="composer" id="composer" autocomplete="off">
        <label for="noteText">Note at <span class="stamp" id="stamp">0:00.0</span></label>
        <textarea id="noteText" placeholder="Pause where something should change, then say what. For example: cut the pause before “or you can get”."></textarea>
        <div class="row">
          <span class="hint" id="composerHint">Typing pauses the video, so the note keeps its moment.</span>
          <button class="primary" id="addNote" type="submit" disabled>Add note</button>
        </div>
      </form>

      <div class="listhead">
        <h2 id="listTitle">Notes</h2>
        <div class="filter" role="group" aria-label="Show">
          <button type="button" id="fOpen" aria-pressed="true">Open</button>
          <button type="button" id="fAll" aria-pressed="false">All</button>
        </div>
      </div>
      <ol class="notes" id="notes"></ol>
      <div class="empty" id="empty">Notes appear here, in time order. Click a time to jump to that moment.</div>
      <p class="notice" id="notice" hidden></p>
    </div>
  </section>
</div>

<script>
// The job's versions, written by scripts/review-page.mjs. Notes live in this page's database ("notes").
const REVIEW = /*__REVIEW_DATA__*/ { title: "Review", client: "", job: "", versions: [] } /*__END__*/;

const $ = (id) => document.getElementById(id);
const fmt = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(1).padStart(4, "0")}`; };
let current = REVIEW.versions.length ? REVIEW.versions[REVIEW.versions.length - 1].label : null;
try { const saved = localStorage.getItem("review-version"); if (saved && REVIEW.versions.some((v) => v.label === saved)) current = saved; } catch (e) {}
let showAll = false;
let allNotes = [];
let db = null, user = null, canWrite = null, myId = null;

$("title").textContent = REVIEW.title;
$("eyebrow").textContent = [REVIEW.client, "Review"].filter(Boolean).join(" · ");

function renderVersions() {
  const box = $("versions");
  box.replaceChildren();
  for (const v of REVIEW.versions) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${v.label}${v.date ? " · " + v.date : ""}`;
    b.setAttribute("aria-pressed", String(v.label === current));
    b.onclick = () => { current = v.label; try { localStorage.setItem("review-version", current); } catch (e) {} renderVersions(); loadVideo(); renderNotes(); };
    box.appendChild(b);
  }
  const v = REVIEW.versions.find((x) => x.label === current);
  $("changes").textContent = v && v.changes ? v.changes : "";
}

function loadVideo() {
  const v = REVIEW.versions.find((x) => x.label === current);
  const video = $("video");
  if (!v) return;
  if (video.getAttribute("src") !== v.file) video.setAttribute("src", v.file);
  if (v.aspect) document.documentElement.style.setProperty("--aspect", v.aspect);
  $("vmeta").textContent = [v.label, v.length, v.size].filter(Boolean).join(" · ");
}

const video = $("video");
video.addEventListener("timeupdate", () => { $("clock").textContent = fmt(video.currentTime); $("stamp").textContent = fmt(video.currentTime); });
$("noteText").addEventListener("focus", () => { if (!video.paused) video.pause(); });
$("noteText").addEventListener("input", () => { $("addNote").disabled = !$("noteText").value.trim() || !db || canWrite === false; if (!video.paused) video.pause(); });

$("fOpen").onclick = () => { showAll = false; $("fOpen").setAttribute("aria-pressed", "true"); $("fAll").setAttribute("aria-pressed", "false"); renderNotes(); };
$("fAll").onclick = () => { showAll = true; $("fAll").setAttribute("aria-pressed", "true"); $("fOpen").setAttribute("aria-pressed", "false"); renderNotes(); };

async function renderNotes() {
  const list = $("notes");
  const mine = allNotes.filter((n) => n.version === current).sort((a, b) => a.t - b.t);
  const shown = showAll ? mine : mine.filter((n) => n.status !== "done");
  const openCount = mine.filter((n) => n.status !== "done").length;
  $("listTitle").textContent = `Notes on ${current || "this cut"}${mine.length ? ` · ${openCount} open` : ""}`;
  $("empty").hidden = shown.length > 0;
  $("empty").textContent = mine.length && !shown.length ? "Every note on this version is done. Show All to see them." : "No notes on this version yet. Pause where something should change and write it down. Click a time in a note to jump to that moment.";
  const ids = [...new Set(shown.map((n) => n.by).filter(Boolean))];
  const people = user && ids.length ? await user.profiles(ids) : {};
  list.replaceChildren();
  for (const n of shown) {
    const li = document.createElement("li");
    li.className = "note" + (n.status === "done" ? " done" : "");
    const top = document.createElement("div");
    top.className = "top";
    const chip = document.createElement("button");
    chip.type = "button"; chip.className = "chip"; chip.textContent = fmt(n.t);
    chip.setAttribute("aria-label", `Jump to ${fmt(n.t)}`);
    chip.onclick = () => { video.currentTime = n.t; video.pause(); };
    const who = document.createElement("span");
    who.className = "who";
    const p = people[n.by];
    if (p) { const img = document.createElement("img"); img.src = p.avatarUrl; img.alt = ""; who.appendChild(img); }
    const nm = document.createElement("span");
    nm.textContent = (p && p.name) || (n.by === "claude" ? "7 Studios" : "Someone");
    who.appendChild(nm);
    top.append(chip, who);
    if (db && canWrite !== false) {
      const st = document.createElement("button");
      st.type = "button"; st.className = "status";
      st.textContent = n.status === "done" ? "Done" : "Open";
      st.setAttribute("aria-label", n.status === "done" ? "Reopen this note" : "Mark this note done");
      st.onclick = async () => { st.disabled = true; try { await db.doc("notes/" + n.id).update({ status: n.status === "done" ? "open" : "done" }); } catch (e) { showNotice("That change didn't save. You may not have permission to change notes on this page."); } st.disabled = false; };
      top.appendChild(st);
    }
    const text = document.createElement("div");
    text.className = "text"; text.textContent = n.text;
    li.append(top, text);
    if (n.reply) { const r = document.createElement("div"); r.className = "reply"; r.textContent = n.reply; li.appendChild(r); }
    list.appendChild(li);
  }
}

function showNotice(msg) { const el = $("notice"); el.textContent = msg; el.hidden = !msg; }

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("noteText").value.trim();
  if (!text || !db) return;
  $("addNote").disabled = true;
  try {
    await db.collection("notes").add({ version: current, t: Math.round(video.currentTime * 10) / 10, text, by: myId, at: new Date().toISOString(), status: "open" });
    $("noteText").value = "";
    showNotice("");
  } catch (err) {
    if (err && err.code === "invalid_argument") { canWrite = false; setComposer(); }
    showNotice(err && err.code === "quota_exceeded" ? "This review is full. Ask the studio to archive old notes." : "Your note didn't save. Check your connection, or ask the owner for Contributor access.");
  }
  $("addNote").disabled = !$("noteText").value.trim();
});

function setComposer() {
  const off = !db || canWrite === false;
  $("noteText").disabled = off;
  $("addNote").disabled = off || !$("noteText").value.trim();
  $("composerHint").textContent = !db
    ? "Sign in to claude.ai to read and add notes."
    : canWrite === false ? "You can read notes. Ask the owner for Contributor access to add your own." : "Typing pauses the video, so the note keeps its moment.";
}

renderVersions();
loadVideo();
renderNotes();
setComposer();

(async () => {
  // Outside the claude.ai viewer (a saved copy) there is no window.claude: show the cut, no notes.
  const use = (name) => (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null));
  [db, user] = await Promise.all([use("db"), use("user")]);
  if (user) { myId = await user.id(); canWrite = await user.can("data.write"); }
  setComposer();
  if (!db) { $("empty").textContent = "Notes need a signed-in view of this page."; return; }
  db.collection("notes").onSnapshot(
    (snap) => { allNotes = snap.docs.map((d) => ({ id: d.id, ...d.data() })); renderNotes(); },
    () => showNotice("Notes stopped updating. Reload the page to see the latest."),
  );
})();
</script>
